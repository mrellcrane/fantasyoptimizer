name: Daily fantasy moves

on:
  schedule:
    # The full run: every day at 10:17 ET (9:17 once daylight time ends).
    - cron: "17 14 * * *"
    # Pregame checks every 15 minutes through the NFL's game windows (Thu-Mon, incl.
    # London, Thanksgiving, Christmas and late-season Saturdays). Each one quits in
    # seconds unless one of your players kicks off within 90 minutes, after inactives
    # are out. GitHub sometimes runs schedules late or skips them, so several chances
    # per game matter. Times are UTC.
    - cron: "7-59/15 12-23 * * 0,1,4,5,6"
    - cron: "7-59/15 0-1 * * 0,1,2,5,6"   # night games, which end after midnight UTC
  workflow_dispatch:
    inputs:
      job:
        description: "full = everything; pregame = lineup only, if one of your games starts soon"
        type: choice
        options: [full, pregame]
        default: full
      mode:
        description: "default follows the DRY_RUN repo variable"
        type: choice
        options: [default, dry-run, live]
        default: default
      trade:
        description: 'Score a trade, e.g. "give Breece Hall, Joe Burrow; get Chris Olave"'
        type: string
        default: ""
      move:
        description: 'Make one pickup now, e.g. "add Jets D/ST, drop Bills D/ST" (follows mode)'
        type: string
        default: ""

concurrency:
  # Pregame checks queue among themselves, so they never cancel a full run that's waiting.
  group: fantasy-optimizer-${{ ((github.event_name == 'schedule' && github.event.schedule != '17 14 * * *') || inputs.job == 'pregame') && 'pregame' || 'full' }}
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREGAME: ${{ ((github.event_name == 'schedule' && github.event.schedule != '17 14 * * *') || inputs.job == 'pregame') && 'true' || '' }}
    permissions:
      contents: write   # to save reports on the `reports` branch
    steps:
      # Always the latest code, so "Re-run jobs" doesn't replay an old version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore memory from previous runs
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: optimizer-state-${{ github.run_id }}
          restore-keys: optimizer-state-

      - name: Run optimizer
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_TEAM_ID: ${{ vars.ESPN_TEAM_ID }}
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          TRADE: ${{ inputs.trade }}
          MOVE: ${{ inputs.move }}
          DRY_RUN: ${{ inputs.mode == 'live' && 'false' || inputs.mode == 'dry-run' && 'true' || vars.DRY_RUN || 'true' }}
        run: python -m fantasyoptimizer ${PREGAME:+--pregame}

      - name: Save memory
        if: always() && !env.PREGAME && hashFiles('.state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .state
          key: optimizer-state-${{ github.run_id }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            report.md
            snapshot.json
          if-no-files-found: ignore

      - name: Save report to the reports branch
        if: success() && hashFiles('snapshot.json') != ''
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%d-%H%M)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin reports; then
            git worktree add --detach pub FETCH_HEAD
            git -C pub checkout -q -B reports
          else
            git worktree add --detach pub
            git -C pub checkout -q --orphan reports
            git -C pub rm -rfq .
          fi
          mkdir -p pub/history
          if [ -z "$PREGAME" ]; then   # pregame lineup changes go in history only
            cp report.md pub/latest.md
            cp snapshot.json pub/latest.json
          else
            stamp="$stamp-pregame"
          fi
          cp report.md "pub/history/$stamp.md"
          cp snapshot.json "pub/history/$stamp.json"
          git -C pub add -A
          git -C pub commit -qm "Report $stamp" || exit 0
          for attempt in 1 2 3; do   # a full run and a pregame check can finish together
            git -C pub push -q origin HEAD:reports && exit 0
            git -C pub fetch -q --depth=20 origin reports && git -C pub rebase -q FETCH_HEAD
          done
          exit 1
