# Tuning knobs. The ESPN cookies are secrets: they go in GitHub secrets, never here.
# Apart from your league and team, every value below is the default.

[general]
league_id = 473811221        # ScreamStream 2024 League (ESPN_LEAGUE_ID overrides)
team_id = 4                  # Elliott Eats Everyone (ESPN_TEAM_ID overrides)
# Safety switch. The DRY_RUN env var overrides this (the GitHub workflow sets it).
dry_run = true

[projection]
# How a player's expected points per game is blended. Weights are relative.
weight_week = 0.30           # ESPN's projection for this week
weight_ros = 0.35            # ESPN's rest-of-season per-game projection
weight_season = 0.10         # ESPN's preseason projection
weight_actual = 0.25         # What they've actually scored per game
actual_full_weight_games = 6 # Trust actual scoring fully after this many games
season_games = 17

[value]
bench_weight = 0.10          # Credit for bench depth, as a fraction of starter points
bench_depth = 2              # How many bench players count as depth
playoff_weight = 1.5         # Fantasy playoff weeks matter this much more

[sim]
n_sims = 4000                # Season simulations per scenario
sd_fraction = 0.20           # Weekly score randomness (std dev as a share of the mean)
min_sd = 15.0
seed = 2026

[lineup]
enabled = true               # Set the best lineup every run (benches byes, OUT players)
min_gain = 0.5               # Ignore lineup changes worth less than this many points
pregame_minutes = 90         # Pregame checks only act when one of your players kicks off
                             # within this many minutes (inactives are out ~90 min before)

[waivers]
enabled = true
max_moves_per_run = 0        # 0 = suggest pickups in the report but never make them
                             # (you make them yourself). 1 = make the best one each run.
                             # The code default is 1. See [streaming] auto for D/ST.
min_gain_points = 12.0       # Rest-of-season starting-lineup points a pickup must add
                             # (less than ~1 point a week isn't worth losing depth over)
min_title_gain = 0.0         # ...and it can't lower title odds (percentage points)
pool_per_position = 8        # How many free agents to consider at each position
sim_candidates = 10
never_drop = []              # e.g. ["Christian McCaffrey"]
# A pickup that only starts a few weeks, all far off (say, one bye week in week 10),
# is a "patch": it's reported, but made closer to that week instead of now.
patch_lookahead_weeks = 2    # "Now" means the next this-many weeks
patch_min_near_gain = 1.0    # Helps less than this in those weeks...
patch_max_start_share = 0.34 # ...and starts less than this share of remaining weeks
hold_days = 7                # Don't cut someone we picked up within this many days
readd_cooldown_days = 14     # Don't re-add someone we cut within this many days
faab_max_fraction = 0.30     # Biggest bid, as a share of remaining FAAB
faab_gain_for_max_bid = 60.0 # A pickup worth this many points gets the biggest bid
faab_min_bid = 1

[streaming]
# Positions you pick up fresh each week for the matchup instead of holding one player
# all season. ESPN only projects a week or two ahead; for later weeks the bot assumes
# you'll grab a free agent worth what the best one has been projected at lately. So a
# defense is only worth holding if it beats that, and pickups swap one for another
# instead of cutting a bench player. [] turns it off.
positions = ["D/ST"]
min_gain_points = 2.0        # A stream only has to win its week, not the season
auto = true                  # Make streaming pickups automatically, even though
                             # waivers.max_moves_per_run = 0 keeps all others manual.
                             # The code default is false.

[trades]
enabled = true
max_proposals_per_run = 0    # 0 = suggest trades in the report but never send them
                             # (you send them yourself). Keep it low if you raise it.
team_cooldown_days = 7       # Max one offer per manager per week
repeat_cooldown_days = 30    # Never re-send the same offer within a month
min_gain_points = 10.0       # Rest-of-season points the trade must add for you
min_title_gain = 0.5         # ...and title odds must rise by this much (percentage points)
min_partner_gain_points = 5.0  # Must visibly help their lineup too (their need)
min_fairness = 0.90          # They must get at least 90% of the value they give
                             # (value = points above the best free agent at that position)
max_overpay = 1.6
min_accept_chance = 0.30     # Don't send offers they'd probably reject
accept_fairness_weight = 6.0
accept_gain_scale = 20.0
pool_size = 10               # Top N players per team considered for 2-player packages
max_players_per_side = 2
sim_candidates = 30
untouchable = []             # e.g. ["Justin Jefferson"]
not_available = ["Bijan Robinson"]  # Other teams' players they've said they won't trade
do_not_trade_with = ["Kat's Top-Notch Team"]  # Team names, abbreviations, or ids
message = ""                 # Note attached to each offer
pitch_as_message = false     # true = attach the one-line pitch from the report instead
expiration_hours = 48
# "Long shots" section of the report: trades that help you more but are less likely
# to be accepted. They can even look slightly worse for the other team on paper.
long_shots = true
long_shot_min_fairness = 0.60          # They get as little as 60% of the value they give
long_shot_min_accept_chance = 0.05
long_shot_min_partner_gain_points = -30.0
propose_long_shots = false   # true = the bot sends long shots instead of the safe picks
# Your pending offers get a verdict each run: keep, pull, or pull and send a better
# one instead. A replacement has to beat the offer by this much title odds, after
# accept chance (percentage points). Suggestions only: the bot never cancels offers.
swap_min_title_gain = 0.5
# Feeling bolder? These send more offers, including ones that favor you more:
#   max_proposals_per_run = 3    (still max one open offer per manager, and per player)
#   min_fairness = 0.75          (they can get as little as 75% of what they give)
#   min_accept_chance = 0.15

[injury]
# Chance a player plays this week, next week, ... (1.0 after the list ends).
# ESPN zeroes Out/Doubtful players itself but projects Questionable ones as if they
# play. Questionable players have played ~73-75% of the time since the NFL dropped
# "Probable" in 2016 (ESPN; Zach Binney's injury-report analysis).
OUT = [0.0, 0.75]
DOUBTFUL = [0.3, 0.85]
QUESTIONABLE = [0.74]
INJURY_RESERVE = [0.0, 0.0, 0.0, 0.0, 0.5]
SUSPENSION = [0.0]

[expected_return]
# When injured players are expected back, from the news. Overrides the generic
# [injury] curve for them. Update or delete as news changes.
"A.J. Brown" = 7   # high ankle sprain wk 1; insiders: back in ~6 weeks

[questionable_performance]
# Questionable players who do play score less: RBs and WRs ~8.5-10% on average,
# QBs no measurable drop (4for4's study of injury designations). Positions not
# listed are left at 1.0.
RB = 0.91
WR = 0.91
TE = 0.91
